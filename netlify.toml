[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  included_files = ["private/manual-veedurias.pdf"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://elfsightcdn.com https://universe-static.elfsightcdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.elfsightcdn.com https://storage.elfsight.com https://*.cdninstagram.com https://*.fbcdn.net; media-src 'self' https://*.elfsightcdn.com https://storage.elfsight.com https://*.cdninstagram.com https://*.fbcdn.net; frame-src https://www.youtube.com; connect-src 'self' https://core.service.elfsight.com https://widget-data.service.elfsight.com https://cors-proxy.utils.elfsightcdn.com https://phosphor.utils.elfsightcdn.com; font-src 'self' data:; form-action 'self'; base-uri 'self'; object-src 'none'"
