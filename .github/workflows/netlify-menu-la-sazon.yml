name: Deploy La Sazon de Lita to Netlify

on:
  push:
    branches: [main]
    paths:
      - 'proyectos/menu-digital-la-sazon-de-lita/**'
      - '.github/workflows/netlify-menu-la-sazon.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create separate Netlify site
        id: site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          site_id_file=".github/netlify-sites/la-sazon-de-lita-id"
          site_name="menu-la-sazon-de-lita"

          if [ -s "$site_id_file" ]; then
            site_id="$(tr -d '\r\n' < "$site_id_file")"
            site_url="https://${site_name}.netlify.app"
          else
            response="$(curl --fail-with-body --silent --show-error \
              -X POST "https://api.netlify.com/api/v1/sites" \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$site_name\"}")"
            site_id="$(jq -r '.id // empty' <<< "$response")"
            site_url="$(jq -r '.ssl_url // .url // empty' <<< "$response")"
            if [ -z "$site_id" ] || [ -z "$site_url" ]; then
              echo "Netlify did not return a site ID and URL." >&2
              exit 1
            fi

            mkdir -p "$(dirname "$site_id_file")"
            printf '%s\n' "$site_id" > "$site_id_file"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$site_id_file"
            git commit -m "Record La Sazón de Lita Netlify site"
            git push origin HEAD:main
          fi

          echo "site_id=$site_id" >> "$GITHUB_OUTPUT"
          echo "site_url=$site_url" >> "$GITHUB_OUTPUT"
          {
            echo "## La Sazón de Lita deployed separately"
            echo ""
            echo "Site: $site_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish menu folder
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './proyectos/menu-digital-la-sazon-de-lita'
          production-branch: main
          github-token: ${{ github.token }}
          deploy-message: 'Deploy La Sazón de Lita from GitHub'
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.site.outputs.site_id }}
